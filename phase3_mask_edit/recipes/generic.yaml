schema_version: 1
primitive_set: phase3_generic_v1

label_space:
  tissue:
    - Background
    - Tumor
    - Stroma
    - Necrosis
    - Immune infiltrate
    - Normal epithelium
    - Blood vessel
    - Other tissue
  cells:
    - Neoplastic
    - Inflammatory
    - Connective
    - Dead
    - Epithelial

# ── Global assumptions ──────────────────────────────────────────────────────
# All pixel-distance parameters assume 40x magnification (≈0.25 µm/px).
# To adapt to other magnifications, scale proportionally:
#   20x → ×0.5,  10x → ×0.25,  5x → ×0.125
assumed_resolution:
  magnification: 40
  approx_um_per_px: 0.25

defaults:
  intended_use: semantic_editing_and_deidentification
  change_area_buckets:
    small: [0.08, 0.14]
    medium: [0.14, 0.24]
    large: [0.24, 0.40]
    xlarge: [0.40, 0.70]
  default_bucket: medium
  cell_generation_policy:
    unchanged_region: retain_original_cells
    changed_region: probnet_generate
    fallback: nuclei_library
    manual_cell_mask_editing: false
  validation:
    require_nonempty_change_region: true
    forbid_background_leakage: true
    require_legal_output_labels: true
    default_max_changed_area_fraction: 0.40
    max_changed_area_fraction: 0.70
    min_changed_area_fraction: 0.08
  retries:
    max_attempts: 10

primitives:

  # ════════════════════════════════════════════════════════════════════════
  # 1. TUMOR BURDEN INCREASE
  # ════════════════════════════════════════════════════════════════════════
  - name: tumor_burden_increase
    version: v1
    pathology_meaning: tumor growth and local invasion
    required_tissue_labels:
      - Tumor
    required_context:
      - editable_non_tumor_tissue
    optional_tissue_labels:
      - Stroma
      - Normal epithelium
      - Other tissue
      - Immune infiltrate
    mask_operation:
      type: sdf_boundary_expansion
      source: Tumor
      target_priority:
        - Stroma
        - Normal epithelium
        - Other tissue
        - Immune infiltrate
      preserve_source_subtype: nearest_boundary_tumor_label
    spatial_pattern:
      expansion_mode: broad_boundary_growth
      noise: multi_scale_smooth
      forbid_targets:
        - Background
    parameter_ranges:
      target_area_delta_fraction:
        mild: [0.08, 0.14]
        moderate: [0.14, 0.24]
        significant: [0.24, 0.40]
        xlarge_deid: [0.40, 0.60]
    probnet_bias:
      Neoplastic: up_slight
      Connective: down_if_source_stroma
      Epithelial: down_if_source_normal_epithelium
    validation_rules:
      - tumor_area_must_increase
      - new_tumor_must_touch_or_neighbor_original_tumor
      - changed_area_within_parameter_range
    expected_failure_cases:
      - no_tumor
      - no_editable_non_tumor_tissue
      - tumor_already_too_large
      - expansion_would_touch_only_background
      - changed_area_below_minimum
      - no_editable_non_tumor_tissue_only_necrosis_available
    overlap_guard:
      use_tumor_burden_increase_for_tongues_or_budding_islands

  # ════════════════════════════════════════════════════════════════════════
  # 2. TUMOR BURDEN DECREASE
  # ════════════════════════════════════════════════════════════════════════
  - name: tumor_burden_decrease
    version: v1
    pathology_meaning: tumor regression without committing to one biological mechanism
    required_tissue_labels:
      - Tumor
    required_context:
      - valid_backfill_tissue
    optional_tissue_labels:
      - Stroma
      - Other tissue
      - Normal epithelium
      - Immune infiltrate
    mask_operation:
      type: sdf_boundary_shrink
      source: Tumor
      backfill_priority:
        - Stroma
        - Other tissue
        - Normal epithelium
        - Immune infiltrate
      preserve_remaining_tumor_subtype: true
    spatial_pattern:
      shrink_mode: inward_boundary_regression
      edge_fade: true
      fragment_cleanup: true
    parameter_ranges:
      target_area_decrease_fraction:
        mild: [0.08, 0.14]
        moderate: [0.14, 0.24]
        significant: [0.24, 0.40]
        xlarge_deid: [0.40, 0.70]
      # ── CHANGED: min_remaining is now mode-dependent ──
      # Teaching mode keeps a visible residual; deid mode allows full removal.
      min_remaining_tumor_fraction:
        default: 0.02
        xlarge_deid: 0.0
    probnet_bias:
      default: none
      treatment_response_recipe:
        Dead: up_optional
        Connective: up_optional
    validation_rules:
      - tumor_area_must_decrease
      - released_region_must_not_be_background
      - released_region_must_start_from_valid_backfill_boundary
      - released_region_boundary_smoothed_locally_by_gaussian_threshold
      - do_not_shrink_external_background_facing_tumor_boundary
      - do_not_orphan_existing_necrosis
      - remaining_tumor_above_minimum_for_current_mode
    expected_failure_cases:
      - no_tumor
      - tumor_too_small
      - no_valid_backfill_tissue
      - shrink_would_delete_tumor       # only fires when mode != xlarge_deid
    overlap_guard:
      use_necrosis_resolution_for_necrosis_repair
      use_stromal_desmoplasia_for_external_stromal_reaction

  # ════════════════════════════════════════════════════════════════════════
  # 3. BOUNDARY PUSHING REMODEL
  # ════════════════════════════════════════════════════════════════════════
  - name: boundary_pushing_remodel
    version: v1
    pathology_meaning: infiltrative tumor margin remodeled toward a pushing or circumscribed border
    required_tissue_labels:
      - Tumor
    required_context:
      - valid_backfill_tissue
    optional_tissue_labels:
      - Stroma
      - Other tissue
      - Normal epithelium
    mask_operation:
      type: infiltrative_to_pushing_margin
      source: Tumor
      backfill_priority:
        - Stroma
        - Other tissue
        - Normal epithelium
    spatial_pattern:
      remodel_direction: infiltrative_to_pushing
      remove_features:
        - small_spikes
        - jagged_edges
        - isolated_tumor_islands
      fill_features:
        - shallow_stromal_notches
      area_change_mode: near_conservative
      protect_internal_holes:
        - Background
        - Necrosis
    parameter_ranges:
      target_changed_area_fraction:
        mild: [0.08, 0.14]
        moderate: [0.14, 0.20]
        significant: [0.20, 0.28]
      max_changed_area_fraction: 0.30
      default_smooth_radius_px: 18
      max_abs_tumor_area_delta_fraction: 0.02
      min_component_area_px: 80
    probnet_bias:
      default: none
      Stroma: Connective_up_slight_if_backfilled
    validation_rules:
      - boundary_complexity_must_decrease
      - tumor_area_change_must_remain_small
      - tumor_must_not_fragment_or_disappear
      - do_not_fill_background_or_necrosis_holes
    expected_failure_cases:
      - no_tumor
      - tumor_too_small
      - tumor_already_pushing_or_smooth
      - remodeling_would_delete_tumor
    overlap_guard:
      use_tumor_burden_decrease_for_large_regression
      use_boundary_pushing_remodel_for_opposite_infiltrative_direction

  # ════════════════════════════════════════════════════════════════════════
  # 4. NECROSIS APPEARANCE
  # ════════════════════════════════════════════════════════════════════════
  - name: necrosis_appearance
    version: v1
    pathology_meaning: ischemic tumor necrosis
    required_tissue_labels:
      - Tumor
    required_context:
      - intratumoral_hypoxic_candidate_region
    # ── CHANGED: Necrosis moved from required to optional ──
    # When existing Necrosis is absent the candidate map degrades gracefully
    # to (tumor_interior + far_from_vessel) weights only, enabling the
    # teaching scenario "add necrosis to a non-necrotic tumor".
    optional_tissue_labels:
      - Necrosis
      - Blood vessel
      - Stroma
      - Immune infiltrate
    mask_operation:
      type: intratumoral_replacement
      source: Tumor
      target: Necrosis
    spatial_pattern:
      candidate_map: necrosis_probability
      candidate_weights:
        existing_necrosis_neighborhood: 0.45    # drops to 0 when no Necrosis present
        tumor_interior_far_from_outer_boundary: 0.35
        tumor_region_far_from_blood_vessel: 0.20
      # ── ADDED: fallback weights when no existing Necrosis ──
      candidate_weights_no_existing_necrosis:
        tumor_interior_far_from_outer_boundary: 0.60
        tumor_region_far_from_blood_vessel: 0.40
      forbid_targets:
        - Background
        - Stroma
      shape_mode:
        - irregular_blob
        - fissure_like_region
    parameter_ranges:
      target_changed_area_fraction:
        mild: [0.08, 0.14]
        moderate: [0.14, 0.24]
        significant: [0.24, 0.40]
        xlarge_deid: [0.40, 0.60]
      max_necrosis_fraction_of_tumor: 0.60
    probnet_bias:
      Dead: up
      Neoplastic: down
      Inflammatory: up_slight_at_necrosis_edge
    validation_rules:
      - necrosis_area_must_increase
      - new_necrosis_must_be_inside_original_tumor
      - candidate_region_must_have_high_necrosis_probability
      - new_region_must_not_be_too_small_or_fragmented
    expected_failure_cases:
      - no_tumor
      - tumor_too_small
      - no_high_probability_hypoxic_candidate_region
      # removed: no_necrosis_label — now handled by fallback weights
    overlap_guard:
      use_necrosis_expansion_when_existing_necrosis_is_required

  # ════════════════════════════════════════════════════════════════════════
  # 5. STROMAL IMMUNE INFILTRATION
  # ════════════════════════════════════════════════════════════════════════
  - name: stromal_immune_infiltration
    version: v1
    pathology_meaning: stromal TIL increase around tumor
    required_tissue_labels:
      - Stroma
    required_context:
      - sufficient_peritumoral_stroma
    optional_tissue_labels:
      - Tumor
      - Immune infiltrate
      - Other tissue
      - Normal epithelium
    mask_operation:
      type: peritumoral_stroma_to_immune
      source: Stroma
      target: Immune infiltrate
    spatial_pattern:
      region: outside_tumor_stroma
      distance_policy: peritumoral_priority_no_hard_limit
      modes:
        - patchy_stromal_infiltrate
        - partial_peritumoral_band
      avoid_replacing_tumor: true
    parameter_ranges:
      immune_area_delta_fraction:
        mild: [0.08, 0.14]
        moderate: [0.14, 0.24]
        significant: [0.24, 0.35]
      max_changed_area_fraction: 0.40
      peritumoral_falloff_radius_px: 96
    probnet_bias:
      Inflammatory: up
      Connective: down_mild
    validation_rules:
      - immune_area_must_increase
      - new_immune_must_be_mainly_outside_tumor
      - tumor_area_must_remain_stable
    expected_failure_cases:
      - no_stroma
      - no_immune_label
      - insufficient_peritumoral_stroma
    overlap_guard:
      use_intratumoral_immune_infiltration_for_within_tumor_changes
      use_peritumoral_inflammation_for_strict_ring_pattern_in_v1_5

  # ════════════════════════════════════════════════════════════════════════
  # 6. INTRATUMORAL IMMUNE INFILTRATION
  # ════════════════════════════════════════════════════════════════════════
  - name: intratumoral_immune_infiltration
    version: v1
    pathology_meaning: intratumoral TIL increase
    required_tissue_labels:
      - Tumor
      - Immune infiltrate
    required_context:
      - sufficient_intratumoral_candidate_area
    optional_tissue_labels:
      - Stroma
    mask_operation:
      type: intratumoral_immune_spots
      source: Tumor
      target: Immune infiltrate
      bias_only_fallback: false
    spatial_pattern:
      region: inside_tumor
      spot_policy:
        max_total_area_fraction_of_tumor: 0.35
        min_spot_area_px: 12      # ≈3 µm² at 40x; ~1-2 lymphocytes
        max_spot_area_px: 256     # ≈64 µm² at 40x; small cluster
        max_spots_per_patch: 32
      avoid_large_sheet_replacement: true
    parameter_ranges:
      target_changed_area_fraction:
        mild: [0.05, 0.10]
        moderate: [0.10, 0.16]
        significant: [0.16, 0.24]
      max_changed_area_fraction: 0.30
    probnet_bias:
      Inflammatory: up
      Neoplastic: down_mild
    validation_rules:
      - new_immune_must_be_inside_original_tumor
      - tumor_body_must_remain
      - no_bias_only_edit_without_immune_tissue_label
    expected_failure_cases:
      - no_tumor
      - no_immune_label
      - tumor_too_small
      - insufficient_intratumoral_candidate_area
    overlap_guard:
      use_stromal_immune_infiltration_for_outside_tumor_changes

  # ════════════════════════════════════════════════════════════════════════
  # 7. IMMUNE INFILTRATION DECREASE
  # ════════════════════════════════════════════════════════════════════════
  - name: immune_infiltration_decrease
    version: v1
    pathology_meaning: immune-cold conversion or immune suppression
    required_tissue_labels:
      - Immune infiltrate
    required_context:
      - valid_backfill_tissue
    optional_tissue_labels:
      - Stroma
      - Tumor
      - Other tissue
    mask_operation:
      type: immune_region_reduction
      source: Immune infiltrate
      backfill_priority:
        - Stroma
        - Other tissue
        - Tumor
    spatial_pattern:
      reduce_priority:
        - isolated_immune_components
        - peripheral_immune_components
        - immune_far_from_tumor
      preserve_policy:
        keep_fraction_near_tumor: true
    parameter_ranges:
      immune_area_decrease_fraction:
        mild: [0.08, 0.14]
        moderate: [0.14, 0.24]
        significant: [0.24, 0.35]
        xlarge_deid: [0.35, 0.60]
      min_remaining_immune_fraction: 0.005
    probnet_bias:
      Inflammatory: down
      Connective: up_slight_if_backfilled_to_stroma
    validation_rules:
      - immune_area_must_decrease
      - backfill_must_be_legal_tissue
      - no_background_holes
    expected_failure_cases:
      - no_immune_label
      - immune_area_too_small
      - no_valid_backfill_tissue
      - reduction_would_create_background_holes
    overlap_guard:
      do_not_use_for_tumor_expanding_into_immune

  # ════════════════════════════════════════════════════════════════════════
  # 8. STROMAL DESMOPLASIA
  # ════════════════════════════════════════════════════════════════════════
  - name: stromal_desmoplasia
    version: v1
    pathology_meaning: peritumoral desmoplastic stromal reaction
    required_tissue_labels:
      - Tumor
      - Stroma
    required_context:
      - peritumoral_editable_region
    optional_tissue_labels:
      - Other tissue
      - Normal epithelium
      - Immune infiltrate
    mask_operation:
      type: peritumoral_stroma_expansion_or_reinforcement
      primary_sources:
        - Other tissue
        - Normal epithelium
      secondary_sources:
        - Immune infiltrate
      target: Stroma
      forbid_sources:
        - Tumor
    spatial_pattern:
      region: outside_tumor_adjacent_to_existing_stroma
      expansion_order:
        - expand_existing_stroma_boundary
        - consume_other_or_normal_epithelium
        - consume_small_stroma_adjacent_immune_components
      immune_to_stroma_constraints:
        max_fraction_of_total_desmoplasia_delta: 0.30
        require_direct_stroma_adjacency: true
      avoid_entering_tumor: true
    parameter_ranges:
      stroma_area_delta_fraction:
        mild: [0.08, 0.14]
        moderate: [0.14, 0.24]
        significant: [0.24, 0.35]
        xlarge_deid: [0.35, 0.55]
      max_distance_from_tumor_px: 64    # ≈16 µm at 40x
    probnet_bias:
      Connective: up
      Inflammatory: neutral_or_up_slight
      Neoplastic: down_in_desmoplasia_region
    validation_rules:
      - stroma_area_or_generation_region_must_increase
      - tumor_area_must_remain_stable
      - change_region_must_be_outside_tumor
      - immune_to_stroma_fraction_within_limit
      - consumed_immune_must_touch_stroma
    expected_failure_cases:
      - no_tumor
      - no_stroma
      - no_peritumoral_editable_region
      - operation_would_reduce_tumor_area
      - immune_conversion_exceeds_limit
      - immune_component_not_adjacent_to_stroma
    overlap_guard:
      do_not_use_for_tumor_to_stroma_regression
      do_not_use_for_primary_immune_decrease


# ═══════════════════════════════════════════════════════════════════════════
# COMPOSITE RECIPES
# ═══════════════════════════════════════════════════════════════════════════
composite_recipes:

  - name: treatment_response
    primitives:
      - tumor_burden_decrease
      - necrosis_appearance
    optional_probnet_bias:
      Dead: up
      Connective: up
    recommended_bucket: xlarge
    notes: Dead bias belongs here, not in baseline tumor_burden_decrease.

  - name: aggressive_progression
    primitives:
      - tumor_burden_increase
      - necrosis_appearance
    optional_probnet_bias:
      Neoplastic: up
    recommended_bucket: large

  - name: immune_hot_conversion
    primitives:
      - stromal_immune_infiltration
      - intratumoral_immune_infiltration
    optional_probnet_bias:
      Inflammatory: up
    recommended_bucket: large

  - name: immune_cold_conversion
    primitives:
      - immune_infiltration_decrease
    optional_probnet_bias:
      Inflammatory: down
    recommended_bucket: xlarge

  # ── ADDED ──
  - name: desmoplastic_reaction
    primitives:
      - stromal_desmoplasia
      - immune_infiltration_decrease
    optional_probnet_bias:
      Connective: up
      Inflammatory: down
    recommended_bucket: large
    notes: >
      Models the classic pancreatic-cancer-like microenvironment:
      fibrosis increases while immune cells are excluded.

# ═══════════════════════════════════════════════════════════════════════════
# v1 SCOPE NOTES  (intentional omissions for future versions)
# ═══════════════════════════════════════════════════════════════════════════
roadmap:
  v1_5_candidates:
    - name: angiogenesis_increase
      reason_deferred: >
        Blood vessel has complex lumen + endothelial morphology in H&E.
        Mask-only editing cannot reliably instruct the generator to produce
        convincing vessel structures. Revisit when generator supports
        structure-aware conditioning.
    - name: glandular_atrophy
      description: Normal epithelium → Stroma (tumor-pressure atrophy)
      reason_deferred: lower priority for v1 use cases
    - name: dysplasia_progression
      description: Normal epithelium → Tumor (pre-malignant transformation)
      reason_deferred: requires careful grading-aware mask logic
    - name: peritumoral_inflammation
      description: strict Crohn-like ring pattern around tumor
      reason_deferred: can be approximated by stromal_immune_infiltration in v1
    - name: cell_level_deidentification
      description: >
        Keep tissue mask unchanged; regenerate all cells via ProbNet
        conditioned on the original per-tissue cell distribution heatmap.
        Tissue semantics and prompt stay identical, but cell-level
        morphology (nuclear shape, placement, clustering) is completely
        refreshed, breaking pixel-level traceability to the source slide.
      reason_deferred: >
        Requires ProbNet to support full-patch cell regeneration mode
        (currently only runs on changed regions). Also needs evaluation
        of whether cell-only regeneration produces sufficient visual
        dissimilarity for de-identification compliance. Planned for v1.5
        once ProbNet full-patch mode is validated.
